name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump (ignored for the first release if no tags exist)"
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (no tag, no GitHub Release)"
        required: false
        default: false
        type: boolean
      upload_to_play_store:
        description: "Also upload AAB to Play Console (needs Play secrets)"
        required: false
        default: false
        type: boolean
      play_store_track:
        description: "Play Store track"
        required: false
        type: choice
        default: "internal"
        options:
          - internal
          - alpha
          - beta
          - production
      play_store_status:
        description: "Play Store status"
        required: false
        type: choice
        default: "draft"
        options:
          - draft
          - completed

jobs:
  release:
    name: Signed GitHub Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: cashiro
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing environment secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add these to Settings → Environments → cashiro → Environment secrets, then re-run."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Current version
        id: current_version
        run: |
          CURRENT_VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          CURRENT_CODE=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/[^0-9]*//g')
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CURRENT_CODE" >> "$GITHUB_OUTPUT"

      - name: Next version
        id: next_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          CODE="${{ steps.current_version.outputs.code }}"
          BUMP="${{ inputs.version_bump }}"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            echo "No tags yet — first Cashiro release uses $CURRENT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "code=$CODE" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "code=$((CODE + 1))" >> "$GITHUB_OUTPUT"
          echo "bump=true" >> "$GITHUB_OUTPUT"

      - name: Tag available
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="v${{ steps.next_version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG already exists on remote"
            exit 1
          fi

      - name: Release notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          NEXT="${{ steps.next_version.outputs.version }}"
          {
            echo "# Cashiro v$NEXT"
            echo
            if [ -n "$LAST_TAG" ]; then
              echo "## Changes since $LAST_TAG"
              echo
              git log "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)"
            else
              echo "## First signed release"
              echo
              echo "SMS-first tracker with optional one-way Firefly III sync and bring-your-own-key AI."
            fi
            echo
            echo "---"
            echo "Install the **universal** APK on most phones. arm64-v8a is smaller if you only need 64-bit."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Bump version
        if: ${{ !inputs.dry_run && steps.next_version.outputs.bump == 'true' }}
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.next_version.outputs.version }}\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${{ steps.next_version.outputs.code }}/" app/build.gradle.kts

      - name: Decode keystore
        if: ${{ !inputs.dry_run }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/cashiro-release.jks"
          test -s "$GITHUB_WORKSPACE/cashiro-release.jks"

      - name: Build signed release APK
        if: ${{ !inputs.dry_run }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleStandardRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/cashiro-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APKs
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.next_version.outputs.version }}"
          DIR="app/build/outputs/apk/standard/release"
          shopt -s nullglob
          if [ -f "$DIR/app-standard-universal-release.apk" ]; then
            mv "$DIR/app-standard-universal-release.apk" "$DIR/Cashiro-v${VERSION}-universal.apk"
          fi
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "$DIR/app-standard-${arch}-release.apk" ]; then
              mv "$DIR/app-standard-${arch}-release.apk" "$DIR/Cashiro-v${VERSION}-${arch}.apk"
            fi
          done
          ls -la "$DIR"
          test -f "$DIR/Cashiro-v${VERSION}-universal.apk"
          apksigner verify --verbose "$DIR/Cashiro-v${VERSION}-universal.apk"

      - name: SHA256
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.next_version.outputs.version }}"
          cd app/build/outputs/apk/standard/release
          for apk in Cashiro-v${VERSION}*.apk; do
            sha256sum "$apk" | tee "${apk}.sha256"
          done

      - name: Commit version bump
        if: ${{ !inputs.dry_run && steps.next_version.outputs.bump == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore(release): bump version to ${{ steps.next_version.outputs.version }} [skip ci]"
          git pull origin main --rebase
          git push origin main

      - name: Tag
        if: ${{ !inputs.dry_run }}
        run: |
          git tag -a "v${{ steps.next_version.outputs.version }}" -m "Cashiro v${{ steps.next_version.outputs.version }}"
          git push origin "v${{ steps.next_version.outputs.version }}"

      - name: GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.next_version.outputs.version }}
          name: Cashiro v${{ steps.next_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/standard/release/Cashiro-v${{ steps.next_version.outputs.version }}-universal.apk
            app/build/outputs/apk/standard/release/Cashiro-v${{ steps.next_version.outputs.version }}-universal.apk.sha256
            app/build/outputs/apk/standard/release/Cashiro-v${{ steps.next_version.outputs.version }}-arm64-v8a.apk
            app/build/outputs/apk/standard/release/Cashiro-v${{ steps.next_version.outputs.version }}-arm64-v8a.apk.sha256
            app/build/outputs/apk/standard/release/Cashiro-v${{ steps.next_version.outputs.version }}-armeabi-v7a.apk
            app/build/outputs/apk/standard/release/Cashiro-v${{ steps.next_version.outputs.version }}-armeabi-v7a.apk.sha256
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

      - name: Build Play App Bundle
        if: ${{ !inputs.dry_run && inputs.upload_to_play_store }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleStandardRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/cashiro-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          AAB_PATH="app/build/outputs/bundle/standardRelease"
          mv "$AAB_PATH/app-standard-release.aab" "$AAB_PATH/Cashiro-v${{ steps.next_version.outputs.version }}.aab"

      - name: Upload to Play Store
        if: ${{ !inputs.dry_run && inputs.upload_to_play_store }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.pennywiseai.tracker
          releaseFiles: app/build/outputs/bundle/standardRelease/Cashiro-v${{ steps.next_version.outputs.version }}.aab
          track: ${{ inputs.play_store_track }}
          status: ${{ inputs.play_store_status }}
          releaseName: v${{ steps.next_version.outputs.version }}
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs/
          mappingFile: app/build/outputs/mapping/standardRelease/mapping.txt

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Would release Cashiro v${{ steps.next_version.outputs.version }} (code ${{ steps.next_version.outputs.code }})"
          cat RELEASE_NOTES.md

      - name: Remove keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/cashiro-release.jks"
